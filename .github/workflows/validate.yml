name: Docs checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli:2.12.0

      - name: Install gettext
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Run Docs checks
        shell: bash
        run: ./tools/check

      - name: Build validated plugin ZIP
        shell: bash
        run: ./tools/build-release

      - name: Upload validated plugin ZIP
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-docs-1.0.0-rc1
          path: |
            dist/core-blueprint-docs-1.0.0-rc1.zip
            dist/core-blueprint-docs-1.0.0-rc1.zip.sha256
          if-no-files-found: error
          retention-days: 14
