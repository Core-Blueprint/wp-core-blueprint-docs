name: Docs checks

on:
  push:
    branches:
      - main
      - 'docs-v1-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: PHP ${{ matrix.php }} static validation
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: for file in assets/js/*.js; do node --check "$file"; done

      - name: Docs conformance
        run: php tools/conformance.php
