name: Docs release QC

on:
  push:
    branches:
      - main
      - 'docs-v1-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-release-qc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-package:
    name: Release package — PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install release build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gettext zip unzip
          python3 -m pip install -q --disable-pip-version-check polib==1.2.0

      - name: Build and validate public RC1 package
        shell: bash
        run: |
          set +e
          BUILD_LOG="${RUNNER_TEMP}/docs-release-build.log"
          bash tools/build-release >"$BUILD_LOG" 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo 'Release build failed; showing the final relevant output:'
            tail -n 100 "$BUILD_LOG"
            exit "$STATUS"
          fi
          cat "$BUILD_LOG"

      - name: Upload public RC1 artifact
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: core-blueprint-docs-1.0.0-rc1
          path: |
            build/core-blueprint-docs-1.0.0-rc1.zip
            build/core-blueprint-docs-1.0.0-rc1.zip.sha256
          if-no-files-found: error
          retention-days: 14
